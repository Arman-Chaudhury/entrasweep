name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate module manifest
        shell: pwsh
        run: Test-ModuleManifest -Path ./src/EntraSweep/EntraSweep.psd1

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./src -Recurse -Severity Warning
          if ($results) { $results | Format-Table -AutoSize | Out-String | Write-Output }
          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) { throw "PSScriptAnalyzer found $($errors.Count) error(s)." }

      - name: Test (Pester)
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser
          Invoke-Pester -Path ./tests -Output Detailed -CI
